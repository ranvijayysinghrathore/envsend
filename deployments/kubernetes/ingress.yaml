apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: envsend-ingress
  namespace: envsend
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - envsend.yourdomain.com
    secretName: envsend-tls
  rules:
  - host: envsend.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: envsend-api
            port:
              number: 80
