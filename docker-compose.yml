version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: envsend-postgres
    environment:
      POSTGRES_USER: envsend
      POSTGRES_PASSWORD: envsend
      POSTGRES_DB: envsend
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envsend"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: envsend-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: envsend-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO client to create bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: envsend-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/envsend-secrets --ignore-existing;
      mc anonymous set none myminio/envsend-secrets;
      echo 'MinIO bucket created successfully';
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  default:
    name: envsend-network
