# Render Blueprint for EnvSend
# This file allows one-click deployment to Render
# https://render.com/docs/blueprint-spec

services:
  # PostgreSQL Database
  - type: pserv
    name: envsend-db
    plan: free
    databaseName: envsend
    databaseUser: envsend

  # API Server
  - type: web
    name: envsend-api
    runtime: go
    plan: free
    buildCommand: cd backend && go build -o bin/server ./cmd/server
    startCommand: ./backend/bin/server
    envVars:
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_PORT
        value: 8080
      - key: SERVER_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: envsend-db
          property: connectionString
      - key: DATABASE_MAX_CONNECTIONS
        value: 10
      - key: DATABASE_MAX_IDLE_CONNECTIONS
        value: 2
      # Add your Upstash Redis URL manually after deployment
      - key: REDIS_URL
        sync: false
      - key: REDIS_PASSWORD
        value: ""
      # Local disk storage (free)
      - key: S3_ENDPOINT
        value: ""
      - key: S3_ACCESS_KEY
        value: ""
      - key: S3_SECRET_KEY
        value: ""
      - key: S3_BUCKET
        value: local
      - key: S3_USE_SSL
        value: false
      - key: S3_REGION
        value: ""
      # Security
      - key: RATE_LIMIT_REQUESTS
        value: 100
      - key: RATE_LIMIT_WINDOW
        value: 60s
      - key: MAX_SECRET_SIZE
        value: 10485760
      - key: DEFAULT_SECRET_EXPIRY
        value: 10m
      - key: MAX_SECRET_EXPIRY
        value: 168h
      # CORS - Update after deploying frontend
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: CORS_ALLOWED_METHODS
        value: GET,POST,DELETE,OPTIONS
      - key: CORS_ALLOWED_HEADERS
        value: Content-Type,Authorization
      # Logging
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json

  # Background Worker
  - type: worker
    name: envsend-worker
    runtime: go
    plan: free
    buildCommand: cd backend && go build -o bin/worker ./cmd/worker
    startCommand: ./backend/bin/worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: envsend-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: WORKER_CLEANUP_INTERVAL
        value: 60s
      - key: WORKER_BATCH_SIZE
        value: 100
      - key: LOG_LEVEL
        value: info
