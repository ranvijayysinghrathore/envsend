apiVersion: apps/v1
kind: Deployment
metadata:
  name: envsend-api
  namespace: envsend
  labels:
    app: envsend-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: envsend-api
  template:
    metadata:
      labels:
        app: envsend-api
    spec:
      containers:
      - name: api
        image: localhost:5000/envsend-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: envsend-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: envsend-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: envsend-secrets
              key: redis-url
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: envsend-secrets
              key: s3-endpoint
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: envsend-secrets
              key: s3-access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: envsend-secrets
              key: s3-secret-key
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: envsend-api
  namespace: envsend
spec:
  selector:
    app: envsend-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: envsend-api-hpa
  namespace: envsend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: envsend-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
